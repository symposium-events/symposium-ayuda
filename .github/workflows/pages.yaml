name: Deploy to GitHub Pages

# Builds the static site on every push to main and publishes it to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions" in the repository.
# hextra is vendored in _vendor/, so neither Go nor Node is needed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Check internal links and anchors
        env:
          TZ: Europe/Madrid
        run: |
          hugo --gc --minify --baseURL "/" --destination "$RUNNER_TEMP/linkcheck"
          python3 scripts/check-links.py "$RUNNER_TEMP/linkcheck"

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Madrid
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url || 'http://localhost/' }}/"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
