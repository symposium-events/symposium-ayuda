baseURL = "https://ayuda.symposium.events/"
title = "Ayuda de Symposium"
defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[module]
  [module.hugoVersion]
    min = "0.146.0"
  [[module.imports]]
    path = "github.com/imfing/hextra"

# ── Languages ─────────────────────────────────────────────────
# Spanish is the default (no prefix); English lives under /en/.
# Translations share the same file path under content/<lang>/.
[languages]
  [languages.es]
    languageName = "Español"
    languageCode = "es-ES"
    weight = 1
    title = "Ayuda de Symposium"
    contentDir = "content/es"
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    title = "Symposium Help"
    contentDir = "content/en"

# ── Navigation ────────────────────────────────────────────────
# Labels are translated by identifier in i18n/*.yaml; `name` is the fallback.
[[menus.main]]
  identifier = "docs"
  name = "Manual"
  pageRef = "/docs"
  weight = 1
[[menus.main]]
  identifier = "events"
  name = "Eventos"
  pageRef = "/docs/eventos"
  weight = 2
[[menus.main]]
  identifier = "admin"
  name = "Administración"
  pageRef = "/docs/administracion"
  weight = 3
[[menus.main]]
  identifier = "faq"
  name = "FAQ"
  pageRef = "/docs/faq"
  weight = 4
[[menus.main]]
  name = "Search"
  weight = 5
  [menus.main.params]
    type = "search"
[[menus.main]]
  identifier = "website"
  name = "symposium.events"
  url = "https://symposium.events"
  weight = 6
  [menus.main.params]
    icon = "globe-alt"

# ── Site params ───────────────────────────────────────────────
[params]
  description = "Manual de ayuda de Symposium, la plataforma de gestión de eventos académicos y científicos."
  # Pages keep the date of their last DokuWiki edit in `lastmod`.
  displayUpdatedDate = true
  dateFormat = ":date_long"

  [params.navbar]
    displayTitle = false
    displayLogo = true
    width = "wide"
    [params.navbar.logo]
      path = "images/brand/symposium-logo.svg"
      dark = "images/brand/symposium-logo-dark.svg"
      width = "157"
      height = "30"

  [params.page]
    width = "wide"

  [params.theme]
    default = "system"
    displayToggle = true

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  [params.toc]
    displayTags = false

  [params.imageZoom]
    enable = true

  [params.editURL]
    enable = false

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.parser]
      # Heading ids without accents, matching the DokuWiki anchors the
      # converter rewrote (la_inscripcion -> la-inscripcion).
      autoHeadingIDType = "github-ascii"
    [markup.goldmark.renderer]
      unsafe = true
