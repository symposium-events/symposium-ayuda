{{- /* Brand footer. Strings in i18n/*.yaml. Layout lives in
       assets/css/symposium/30-components.css (.sym-footer): hextra ships
       precompiled CSS, so only the hx: utilities hextra itself uses exist. */ -}}
<div class="sym-footer">
  <div class="sym-footer__brand">
    <a href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}">
      <img class="hx:block hx:dark:hidden" src="{{ "images/brand/symposium-logo.svg" | relURL }}" alt="Symposium" width="157" height="30" />
      <img class="hx:hidden hx:dark:block" src="{{ "images/brand/symposium-logo-dark.svg" | relURL }}" alt="Symposium" width="157" height="30" />
    </a>
    <p>{{ T "footerTagline" }}</p>
  </div>
  <nav class="sym-footer__nav" aria-label="{{ T "footerNav" }}">
    <a href="{{ "docs" | relLangURL }}">{{ T "docs" }}</a>
    <a href="{{ "docs/faq" | relLangURL }}">FAQ</a>
    <a href="{{ "docs/novedades" | relLangURL }}">{{ T "whatsNew" }}</a>
    <a href="https://symposium.events" target="_blank" rel="noopener">symposium.events</a>
  </nav>
</div>
